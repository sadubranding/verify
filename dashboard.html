<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f2f2f7">
<meta name="robots" content="noindex,nofollow">
<title>Owner Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{color-scheme:light;--bg:#f2f2f7;--card:#fff;--text:#1c1c1e;--muted:#6c6c70;--sep:rgba(60,60,67,.14);--blue:#007aff;--blue-bg:#b9d4ff;--blue-ink:#052557;--green-ink:#14693a;--green-bg:#e3f7e9;--red-ink:#9b1c14;--red-bg:#ffe5e3;--shadow:0 1px 2px rgba(0,0,0,.04),0 8px 28px rgba(0,0,0,.06)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,"Noto Sans Bengali",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.4;padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(40px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.wrap{max-width:760px;margin:0 auto}
.top{display:flex;justify-content:center;margin-top:8px}
.pill{background:var(--blue-bg);color:var(--blue-ink);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:9px 18px;border-radius:999px}
h1{margin:18px 0 6px;text-align:center;font-size:clamp(26px,7vw,40px);line-height:1.1;font-weight:800;letter-spacing:-.03em}
.sub{margin:0 0 22px;text-align:center;color:var(--muted);font-size:16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:16px 12px;text-align:center}
.stat b{display:block;font-size:clamp(24px,6vw,32px);font-weight:800;letter-spacing:-.02em}
.stat span{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:18px 2px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--card);color:var(--text);font:inherit;font-size:15px;font-weight:600;padding:9px 16px;border-radius:999px;box-shadow:var(--shadow);cursor:pointer}
.chip small{color:var(--muted);font-weight:600;margin-left:4px}
.chip.on{background:var(--blue);color:#fff}.chip.on small{color:#dbe9ff}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.field{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:0 14px;box-shadow:var(--shadow)}
.field svg{width:18px;height:18px;color:var(--muted);flex:none}
.field input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:16px;padding:13px 0}
.btn{border:0;background:var(--blue);color:#fff;font:inherit;font-size:15px;font-weight:600;padding:0 18px;min-height:46px;border-radius:14px;cursor:pointer}
.btn.sec{background:var(--blue-bg);color:var(--blue-ink)}
.btn:disabled{opacity:.6;cursor:wait}
.group{margin-top:16px;background:var(--card);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.item{display:flex;align-items:center;gap:14px;padding:14px 16px;position:relative}
.item+.item::before{content:"";position:absolute;top:0;left:84px;right:0;height:1px;background:var(--sep)}
.ph{flex:none;width:54px;height:72px;border-radius:10px;object-fit:cover;background:#e5e5ea}
.info{flex:1;min-width:0}
.nm{font-size:17px;font-weight:700;word-break:break-word}
.meta{font-size:13px;color:var(--muted);margin-top:2px}
.id{display:inline-block;margin-top:6px;font-size:13px;font-weight:700;letter-spacing:.03em;background:var(--blue-bg);color:var(--blue-ink);padding:4px 10px;border-radius:999px}
.st{display:inline-block;margin:6px 0 0 6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--green-bg);color:var(--green-ink)}
.st.en{background:var(--blue-bg);color:var(--blue-ink)}
.st.bad{background:var(--red-bg);color:var(--red-ink)}
.qr{flex:none;width:68px;height:68px;border-radius:8px;overflow:hidden;background:#fff;border:1px solid var(--sep)}
.qr canvas,.qr img{width:100%!important;height:100%!important;display:block}
.empty{padding:28px;text-align:center;color:var(--muted)}
.foot{margin:22px 8px 0;text-align:center;font-size:13px;color:var(--muted)}
@media(max-width:420px){.qr{width:56px;height:56px}.item+.item::before{left:16px}}
</style>
</head>
<body>
<main class="wrap">
  <div class="top"><span class="pill">Owner Dashboard</span></div>
  <h1>Training Overview</h1>
  <p class="sub" id="center">Loading...</p>

  <div class="stats">
    <div class="stat"><b id="s1">-</b><span>Trainees</span></div>
    <div class="stat"><b id="s4">-</b><span>Enrolled</span></div>
    <div class="stat"><b id="s2">-</b><span>Verified</span></div>
    <div class="stat"><b id="s3">-</b><span>Revoked</span></div>
  </div>

  <div class="chips" id="chips"></div>

  <div class="tools">
    <label class="field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" placeholder="Search name or ID" autocomplete="off">
    </label>
    <button class="btn sec" id="csvb" type="button">Download Excel (CSV)</button>
    <button class="btn" id="zipb" type="button">Download QR + Photos (ZIP)</button>
  </div>

  <div class="group" id="list"></div>
  <p class="foot" id="foot"></p>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const base = new URL("./", location.href).href;
const fmt = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ""); return m ? `${m[3]}/${m[2]}/${m[1]}` : (s || ""); };
const isValid = x => (x.status || "valid") === "valid";
const stt = x => isValid(x) ? "Verified" : x.status === "enrolled" ? "Enrolled" : "Revoked";
let ALL = [], batch = "ALL";

function inBatch(){ return ALL.filter(x => batch === "ALL" || x.batch === batch); }
function shown(){ const t = $("q").value.trim().toLowerCase(); return inBatch().filter(x => !t || (x.name || "").toLowerCase().includes(t) || x.id.toLowerCase().includes(t)); }

function qrCanvas(text, size){
  const h = document.createElement("div");
  new QRCode(h, { text, width:size, height:size, correctLevel:QRCode.CorrectLevel.H });
  return h.querySelector("canvas");
}
const io = new IntersectionObserver(es => es.forEach(e => {
  if(!e.isIntersecting) return; io.unobserve(e.target);
  const c = qrCanvas(base + "?id=" + e.target.dataset.id, 200); if(c) e.target.appendChild(c);
}), { rootMargin:"200px" });

function render(){
  const inb = inBatch();
  $("s1").textContent = inb.length;
  $("s2").textContent = inb.filter(isValid).length;
  $("s3").textContent = inb.filter(x => x.status === "revoked").length;
  $("s4").textContent = inb.filter(x => x.status === "enrolled").length;
  const names = [...new Set(ALL.map(x => x.batch))].sort((a, b) => a.localeCompare(b, undefined, { numeric:true }));
  $("chips").innerHTML = [["ALL", "All batches", ALL.length], ...names.map(n => [n, n, ALL.filter(x => x.batch === n).length])]
    .map(([k, l, n]) => `<button class="chip ${k === batch ? "on" : ""}" data-b="${esc(k)}">${esc(l)}<small>${n}</small></button>`).join("");
  document.querySelectorAll(".chip").forEach(b => b.onclick = () => { batch = b.dataset.b; render(); });
  const list = shown();
  $("list").innerHTML = list.length ? list.map(x => `
    <div class="item">
      ${x.photo ? `<img class="ph" src="${esc(x.photo)}" alt="" loading="lazy">` : `<div class="ph"></div>`}
      <div class="info">
        <div class="nm">${esc(x.name)}</div>
        <div class="meta">${esc(x.course)} &middot; ${esc(x.batch)}</div>
        <div class="meta">${x.status === "enrolled" ? "Admitted " + esc(fmt(x.admitted)) : `Issued ${esc(fmt(x.issue))} &middot; Completed ${esc(fmt(x.completion))}`}</div>
        <span class="id">${esc(x.id)}</span><span class="st ${isValid(x) ? "" : x.status === "enrolled" ? "en" : "bad"}">${stt(x)}</span>
      </div>
      <div class="qr" data-id="${esc(x.id)}"></div>
    </div>`).join("") : '<div class="empty">No trainees found.</div>';
  document.querySelectorAll(".qr").forEach(e => io.observe(e));
  $("foot").textContent = `Showing ${list.length} of ${inb.length}`;
}

function csv(list){
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const rows = [["Batch","Certificate ID","Trainee Name","Course","Issue Date","Completion Date","Status","Verify Link"]]
    .concat(list.map(x => [x.batch, x.id, x.name, x.course, fmt(x.issue), fmt(x.completion), stt(x), base + "?id=" + x.id]));
  return "\ufeff" + rows.map(r => r.map(q).join(",")).join("\r\n");
}
function save(blob, name){ const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
const fname = () => (batch === "ALL" ? "All-batches" : batch).replace(/[^\w-]+/g, "-");

$("csvb").onclick = () => { const l = shown(); if(l.length) save(new Blob([csv(l)], { type:"text/csv;charset=utf-8" }), fname() + ".csv"); };
$("zipb").onclick = async () => {
  const list = shown(); if(!list.length) return;
  const b = $("zipb"); b.disabled = true;
  try{
    const z = new JSZip();
    for(let i = 0; i < list.length; i++){
      const x = list[i]; b.textContent = `Preparing ${i + 1}/${list.length}...`;
      const c = qrCanvas(base + "?id=" + x.id, 512), p = document.createElement("canvas");
      p.width = p.height = 608; const g = p.getContext("2d");
      g.fillStyle = "#fff"; g.fillRect(0, 0, 608, 608); g.drawImage(c, 48, 48, 512, 512);
      z.file(`QR/${x.id}.png`, p.toDataURL("image/png").split(",")[1], { base64:true });
      if(x.photo){ try{ const r = await fetch(x.photo); if(r.ok) z.file(`Photos/${x.id}.jpg`, await r.blob()); }catch(e){} }
    }
    z.file("trainees.csv", csv(list));
    save(await z.generateAsync({ type:"blob" }), fname() + ".zip");
  }catch(e){ alert("ZIP banano jayni. Abar try koro."); }
  b.disabled = false; b.textContent = "Download QR + Photos (ZIP)";
};
$("q").addEventListener("input", render);

(async () => {
  try{
    const d = await (await fetch("data.json?t=" + Date.now())).json();
    $("center").textContent = (d.center && d.center.name) || "";
    ALL = Object.entries(d.certificates || {}).map(([id, c]) => Object.assign({ id }, c, { batch: c.batch || "No batch" }))
      .sort((a, b) => (b.issue || "").localeCompare(a.issue || ""));
    render();
  }catch(e){ $("center").textContent = ""; $("list").innerHTML = '<div class="empty">Data load hoyni. Internet check koro.</div>'; }
})();
</script>
</body>
</html>
