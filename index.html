<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f2f2f7">
<title>Certificate Verification | Ahlan Qahwa Barista Training Center</title>
<style>
:root{
  color-scheme:light;
  --bg:#f2f2f7; --card:#ffffff; --text:#1c1c1e; --muted:#6c6c70; --sep:rgba(60,60,67,.14);
  --blue:#007aff; --blue-bg:#cfe2ff; --blue-ink:#08306b;
  --green:#34c759; --green-ink:#14693a; --green-bg:#e3f7e9;
  --red:#ff3b30; --red-ink:#9b1c14; --red-bg:#ffe5e3;
  --portal-bg:#cfe2ff; --portal-ink:#08306b;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 28px rgba(0,0,0,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Segoe UI",Roboto,"Noto Sans Bengali",Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;line-height:1.4;
  padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(32px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
}
.wrap{max-width:640px;margin:0 auto}
svg{display:block}

/* Header */
.portal{display:flex;justify-content:center;margin-top:8px}
.pill{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--portal-bg);color:var(--portal-ink);
  font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  padding:9px 18px;border-radius:999px;
  border:1.5px solid rgba(0,122,255,.38);
  box-shadow:0 4px 14px rgba(0,122,255,.18);
}
.pill svg{width:14px;height:14px}
h1{
  margin:18px 0 8px;text-align:center;
  font-size:clamp(32px,7vw,46px);line-height:1.08;font-weight:800;letter-spacing:-.03em;
}
.sub{
  margin:0 auto 24px;text-align:center;max-width:460px;
  font-size:17px;color:var(--muted);font-weight:400;
}

/* Hero result */
.hero{
  border-radius:28px;padding:30px 24px 28px;text-align:center;color:#fff;
  box-shadow:0 14px 40px -12px rgba(30,160,80,.55);
  background:linear-gradient(145deg,#4ade80 0%,#22c55e 45%,#12994a 100%);
  position:relative;overflow:hidden;
}
.hero::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 80% at 0% 0%,rgba(255,255,255,.35),transparent 55%);
}
.hero.bad{background:linear-gradient(145deg,#ff6b61 0%,#ff3b30 50%,#c81e14 100%);box-shadow:0 14px 40px -12px rgba(255,59,48,.55)}
.hero.warn{background:linear-gradient(145deg,#ffb340 0%,#ff9500 55%,#e07b00 100%);box-shadow:0 14px 40px -12px rgba(255,149,0,.55)}
.hero.load{background:linear-gradient(145deg,#a1a1a8,#7c7c82);box-shadow:none}
.badge{
  position:relative;width:76px;height:76px;margin:0 auto 16px;border-radius:50%;
  background:rgba(255,255,255,.98);display:grid;place-items:center;
  box-shadow:0 8px 24px rgba(0,0,0,.18);
  animation:pop .55s cubic-bezier(.2,1.4,.4,1) both;
}
.badge svg{width:42px;height:42px}
.hero h2{position:relative;margin:0 0 8px;font-size:clamp(26px,6vw,34px);font-weight:800;letter-spacing:.02em;line-height:1.1}
.hero p{position:relative;margin:0 auto;max-width:420px;font-size:16px;line-height:1.45;opacity:.96}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.badge{animation:none}}

/* ID box */
.idbox{
  margin-top:18px;background:var(--blue-bg);color:var(--blue-ink);
  border-radius:22px;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  border:1.5px solid rgba(0,122,255,.38);
  box-shadow:0 8px 22px rgba(0,122,255,.18);
}
.idbox small{display:block;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.8;margin-bottom:4px}
.idbox .id{font-size:clamp(20px,5vw,26px);font-weight:700;letter-spacing:.04em;font-variant-numeric:tabular-nums;word-break:break-all}

/* Grouped list */
.group{margin-top:18px;background:var(--card);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:14px 18px;position:relative}
.row + .row::before{content:"";position:absolute;top:0;left:68px;right:0;height:1px;background:var(--sep)}
.ic{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff}
.ic svg{width:20px;height:20px}
.c-gray{background:linear-gradient(#8e8e93,#6c6c70)}
.c-orange{background:linear-gradient(#ffa63d,#ff8a00)}
.c-red{background:linear-gradient(#ff6259,#ff3b30)}
.c-teal{background:linear-gradient(#4dd0e1,#1fb5c9)}
.c-green{background:linear-gradient(#4cd964,#2fb350)}
.lab{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.val{font-size:17px;font-weight:600;word-break:break-word}
.grow{flex:1;min-width:0}
.status{
  flex:none;display:inline-flex;align-items:center;gap:6px;
  font-size:15px;font-weight:700;padding:7px 14px;border-radius:999px;
  background:var(--green-bg);color:var(--green-ink);
}
.status.bad{background:var(--red-bg);color:var(--red-ink)}
.status svg{width:16px;height:16px}

/* Search */
.search{margin-top:24px}
.search h3{margin:0 0 10px 6px;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
form{display:flex;gap:10px}
.field{flex:1;display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:0 14px;box-shadow:var(--shadow)}
.field svg{width:18px;height:18px;color:var(--muted);flex:none}
input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:17px;padding:14px 0}
input::placeholder{color:var(--muted)}
.go{border:0;background:var(--blue);color:#fff;font:inherit;font-size:16px;font-weight:600;padding:0 22px;border-radius:14px;cursor:pointer;transition:transform .12s}
.go:active{transform:scale(.96)}

.foot{margin:28px 8px 0;text-align:center;font-size:13px;color:var(--muted)}
.foot b{color:var(--text);font-weight:600}
@media (min-width:700px){
  body{padding-top:48px}
  .row{padding:16px 22px}
  .row + .row::before{left:72px}
}
</style>
</head>
<body>
<main class="wrap">

  <div class="portal">
    <span class="pill">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>
      Official Verification Portal
    </span>
  </div>

  <h1>Certificate Verification</h1>
  <p class="sub" id="sub">Confirm the authenticity of certificates issued by Ahlan Qahwa Barista Training Center.</p>

  <section id="hero" class="hero load" aria-live="polite">
    <div class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="#8e8e93" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="8" stroke-dasharray="30 20"/></svg></div>
    <h2>CHECKING…</h2>
    <p>Please wait while we verify the certificate.</p>
  </section>

  <div id="result"></div>

  <section class="search">
    <h3>Verify another certificate</h3>
    <form id="f" autocomplete="off">
      <label class="field">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="idin" placeholder="Certificate ID" autocapitalize="characters" spellcheck="false" aria-label="Certificate ID">
      </label>
      <button class="go" type="submit">Verify</button>
    </form>
  </section>

  <p class="foot">Issued &amp; recognized by <b id="center">Ahlan Qahwa Barista Training Center</b></p>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const ICON = {
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="#22b455" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  cross:'<svg viewBox="0 0 24 24" fill="none" stroke="#ff3b30" stroke-width="3.2" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>',
  warn:'<svg viewBox="0 0 24 24" fill="none" stroke="#ff9500" stroke-width="3" stroke-linecap="round"><path d="M12 6.5v7"/><circle cx="12" cy="17.6" r=".6" fill="#ff9500"/></svg>',
  person:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 20c.8-3.6 3.8-5.5 7.5-5.5s6.7 1.9 7.5 5.5"/></svg>',
  cup:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h12v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V9z"/><path d="M16 10h1.5a2.5 2.5 0 0 1 0 5H16"/><path d="M8 3.5c0 1 .8 1.2.8 2.2M12 3.5c0 1 .8 1.2.8 2.2"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  calcheck:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M9 15l2 2 4-4"/></svg>',
  shield:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>',
  smallcheck:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  smallx:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>'
};

function fmtDate(s){
  if(!s) return "-";
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
  if(!m) return s;
  const mon = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  return `${parseInt(m[3],10)} ${mon[parseInt(m[2],10)-1]} ${m[1]}`;
}

let CENTER = "Ahlan Qahwa Barista Training Center";

function hero(kind, icon, title, text){
  const h = $("hero");
  h.className = "hero" + (kind ? " " + kind : "");
  h.innerHTML = `<div class="badge">${icon}</div><h2>${esc(title)}</h2><p>${esc(text)}</p>`;
}

function row(ic, cls, label, valueHtml){
  return `<div class="row"><div class="ic ${cls}">${ICON[ic]}</div><div class="grow"><div class="lab">${label}</div>${valueHtml}</div></div>`;
}

function render(id, c){
  const valid = (c.status || "valid") === "valid";
  if(valid){
    hero("", ICON.check, "VERIFIED AUTHENTIC", `This certificate is valid and officially recognized by ${CENTER}.`);
  }else{
    hero("bad", ICON.cross, "CERTIFICATE REVOKED", `This certificate is no longer valid and is not recognized by ${CENTER}.`);
  }
  const pill = valid
    ? `<span class="status">${ICON.smallcheck} Verified</span>`
    : `<span class="status bad">${ICON.smallx} Revoked</span>`;
  $("result").innerHTML = `
    <div class="idbox">
      <div><small>Certificate ID</small><div class="id" id="cid">${esc(id)}</div></div>
    </div>
    <div class="group">
      ${row("person","c-gray","Trainee Name",`<div class="val">${esc(c.name)}</div>`)}
      ${row("cup","c-orange","Course Name",`<div class="val">${esc(c.course)}</div>`)}
      ${row("cal","c-red","Issue Date",`<div class="val">${esc(fmtDate(c.issue))}</div>`)}
      ${row("calcheck","c-teal","Completion Date",`<div class="val">${esc(fmtDate(c.completion))}</div>`)}
      <div class="row"><div class="ic ${valid ? "c-green" : "c-red"}">${ICON.shield}</div><div class="grow"><div class="lab">Status</div></div>${pill}</div>
    </div>`;
}

function notFound(id){
  hero("warn", ICON.warn, "NOT FOUND", id ? "We couldn’t find a certificate with this ID. Please check the ID and try again." : "Enter a certificate ID below, or scan the QR code on the certificate.");
  $("result").innerHTML = id ? `<div class="idbox"><div><small>Certificate ID</small><div class="id">${esc(id)}</div></div></div>` : "";
}

async function check(raw){
  const id = (raw || "").trim().toUpperCase();
  if(!id){ notFound(""); return; }
  try{
    const res = await fetch("data.json?t=" + Date.now());
    const data = await res.json();
    if(data.center && data.center.name){
      CENTER = data.center.name;
      $("center").textContent = CENTER;
      $("sub").textContent = `Confirm the authenticity of certificates issued by ${CENTER}.`;
    }
    const c = (data.certificates || {})[id];
    if(!c){ notFound(id); return; }
    render(id, c);
  }catch(e){
    hero("warn", ICON.warn, "CONNECTION ERROR", "We couldn’t load the records. Please check your internet and try again.");
    $("result").innerHTML = "";
  }
}

$("f").addEventListener("submit", e => {
  e.preventDefault();
  const v = $("idin").value.trim();
  history.replaceState(null, "", v ? "?id=" + encodeURIComponent(v) : location.pathname);
  check(v);
  window.scrollTo({top:0, behavior:"smooth"});
});

const q = new URLSearchParams(location.search).get("id");
check(q);
</script>
</body>
</html>
