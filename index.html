<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Certificate Verification</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali",sans-serif;background:#f1f5f9;color:#0f172a;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
  .card{background:#fff;max-width:480px;width:100%;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.08);overflow:hidden}
  .head{background:#0f172a;color:#fff;padding:20px;text-align:center}
  .head h1{margin:0;font-size:18px}
  .head p{margin:4px 0 0;font-size:13px;opacity:.75}
  .status{padding:18px;text-align:center;font-size:20px;font-weight:700}
  .ok{background:#dcfce7;color:#166534}
  .bad{background:#fee2e2;color:#991b1b}
  .wait{background:#e2e8f0;color:#334155}
  .rows{padding:8px 20px 20px}
  .row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #e2e8f0;font-size:15px}
  .row:last-child{border:none}
  .row span{color:#64748b}
  .row b{text-align:right;word-break:break-word}
  .foot{text-align:center;font-size:12px;color:#94a3b8;padding:0 16px 16px}
  form{padding:16px 20px 4px;display:flex;gap:8px}
  input{flex:1;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px}
  button{padding:10px 16px;border:0;border-radius:8px;background:#0f172a;color:#fff;font-size:15px;cursor:pointer}
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <h1 id="center">Certificate Verification</h1>
    <p>সার্টিফিকেট যাচাই / Certificate Verification</p>
  </div>
  <div id="status" class="status wait">অপেক্ষা করুন... / Loading...</div>
  <div id="rows" class="rows"></div>
  <form id="f">
    <input id="idin" placeholder="Certificate ID (e.g. BR-2026-K7M4X9)">
    <button>Verify</button>
  </form>
  <div class="foot">QR scan na hole ekhane ID likhe o check kora jabe</div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function show(ok, title, rows){
  const s = $("status");
  s.className = "status " + (ok ? "ok" : "bad");
  s.textContent = title;
  $("rows").innerHTML = rows.map(r => `<div class="row"><span>${esc(r[0])}</span><b>${esc(r[1])}</b></div>`).join("");
}

async function check(id){
  id = (id || "").trim().toUpperCase();
  if(!id){ $("status").className="status wait"; $("status").textContent="Certificate ID din / Enter ID"; $("rows").innerHTML=""; return; }
  try{
    const res = await fetch("data.json?t=" + Date.now());
    const data = await res.json();
    if(data.center && data.center.name) $("center").textContent = data.center.name;
    const c = (data.certificates || {})[id];
    if(!c){ show(false, "❌ Certificate পাওয়া যায়নি / Not Found", [["Certificate ID", id]]); return; }
    const valid = (c.status || "valid") === "valid";
    show(valid, valid ? "✅ Verified / যাচাইকৃত" : "⚠️ Revoked / বাতিল",
      [["Certificate ID", id],["Trainee Name", c.name],["Course", c.course],["Issue Date", c.issue],["Completion Date", c.completion],["Status", valid ? "Verified ✅" : "Revoked ⚠️"]]);
  }catch(e){
    show(false, "Error: data load hoyni, pore abar try korun", []);
  }
}

$("f").addEventListener("submit", e => { e.preventDefault(); const v=$("idin").value; history.replaceState(null,"","?id="+encodeURIComponent(v.trim())); check(v); });
const q = new URLSearchParams(location.search).get("id");
if(q) $("idin").value = q;
check(q);
</script>
</body>
</html>
